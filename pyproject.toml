[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pseudol10nutil"
dynamic = ["version"]
description = "Classes and functions for performing pseudo-localization on strings and PO files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Leonides T. Saguisag Jr.", email = "leonidessaguisagjr@gmail.com" },
    { name = "Roman Pszonka", email = "roman@pszonka.org" },
]
keywords = ["pseudolocalization", "pseudo-localization", "l10n", "i18n", "gettext", "po"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = ["polib>=1.2.0"]

[project.urls]
Homepage = "https://github.com/RomanPszonka/pseudol10nutil"
Issues = "https://github.com/RomanPszonka/pseudol10nutil/issues"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "types-polib>=1.2.0.20250114",
]

[tool.hatch.version]
path = "src/pseudol10nutil/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pseudol10nutil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
files = ["src", "tests"]
strict = true
pretty = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E4",  # pycodestyle imports
    "E7",  # pycodestyle statements
    "E9",  # pycodestyle runtime errors
    "F",   # pyflakes
    "I",   # isort
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    # Ambiguous/confusable unicode characters are the whole point of
    # pseudo-localization, so these rules do not apply to this project.
    "RUF001",
    "RUF002",
    "RUF003",
]
