# tox (https://tox.wiki/) is a tool for running tests in multiple virtualenvs.
# This configuration file will run the test suite on all supported python
# versions.  To use it, run "uvx tox" (or "pip install tox" and "tox") from
# this directory.

requires = ["tox>=4.22"]
env_list = ["py312", "py313", "py314", "type", "lint"]

[env_run_base]
description = "Run tests under {base_python}"
dependency_groups = ["dev"]
commands = [["pytest"]]

[env.type]
description = "Run mypy static type checks"
dependency_groups = ["dev"]
commands = [["mypy"]]

[env.lint]
description = "Run ruff lint and format checks"
skip_install = true
dependency_groups = ["dev"]
commands = [["ruff", "check", "."], ["ruff", "format", "--check", "."]]
